<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
  --accent: #b4532a; --accent-text: #ffffff; --user: #efe9e1; --code: #f0eee9; --bad: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171716; --panel: #201f1d; --text: #ecebe7; --muted: #9b9993; --line: #34332f;
    --accent: #e0794a; --accent-text: #171716; --user: #2b2925; --code: #2a2926; --bad: #f2b8b5;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
#model { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }
main { flex: 1; display: flex; min-height: 0; }
#chat { flex: 1; overflow-y: auto; padding: 16px; }
.msgs { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.msg { padding: 10px 14px; border-radius: 12px; overflow-wrap: anywhere; }
.msg.user { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
.msg.assistant { background: var(--panel); border: 1px solid var(--line); }
.msg.error { color: var(--bad); border: 1px solid var(--bad); }
.msg pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre; }
.msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font: 13px/1.45 ui-monospace, Consolas, monospace; }
.msg pre code { padding: 0; background: none; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
details.think { color: var(--muted); margin-bottom: 8px; font-size: 14px; white-space: pre-wrap; }
.stats { color: var(--muted); font-size: 12px; margin-top: 6px; }
.empty { color: var(--muted); text-align: center; margin-top: 18vh; }
aside { width: 300px; border-left: 1px solid var(--line); background: var(--panel); padding: 16px; overflow-y: auto; }
aside[hidden] { display: none; }
aside label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
aside input, aside textarea, aside select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
aside .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
aside .row input { width: auto; }
form { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
form .in { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea#input { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; max-height: 40vh; }
@media (max-width: 700px) { aside { position: fixed; inset: 52px 0 0 0; width: auto; z-index: 2; } }
</style>
</head>
<body>
<header>
  <h1>Strata</h1>
  <div id="model">connecting…</div>
  <button id="clear" type="button">New chat</button>
  <button id="toggle" type="button">Settings</button>
</header>
<main>
  <div id="chat"><div class="msgs" id="msgs"><div class="empty" id="empty">Ask anything. Everything runs on this computer.</div></div></div>
  <aside id="settings" hidden>
    <label for="system">System prompt</label>
    <textarea id="system" rows="4" placeholder="You are a helpful assistant."></textarea>
    <label for="temp">Temperature (0 = always the most likely word)</label>
    <input id="temp" type="number" min="0" max="2" step="0.1" value="0.7">
    <label for="maxtok">Max reply length (tokens)</label>
    <input id="maxtok" type="number" min="1" step="1" value="2048">
    <div class="row"><input id="think" type="checkbox"><label for="think" style="margin:0">Let the model think first</label></div>
    <label for="key">API key (only if the server was started with one)</label>
    <input id="key" type="password" autocomplete="off">
  </aside>
</main>
<form id="form">
  <div class="in">
    <textarea id="input" rows="1" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" class="primary" type="submit">Send</button>
  </div>
</form>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('strata.' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('strata.' + k, v); } catch {} },
};
for (const id of ['system', 'temp', 'maxtok', 'key']) { $(id).value = store.get(id, $(id).value); $(id).oninput = () => store.set(id, $(id).value); }
$('think').checked = store.get('think', '0') === '1';
$('think').onchange = () => store.set('think', $('think').checked ? '1' : '0');
$('toggle').onclick = () => { $('settings').hidden = !$('settings').hidden; };

let history = [];   // {role, content} sent to the server
let busy = null;    // AbortController of the running request

const headers = () => {
  const h = { 'Content-Type': 'application/json' };
  if ($('key').value) h.Authorization = 'Bearer ' + $('key').value;
  return h;
};

async function loadModel() {
  try {
    const r = await fetch('/v1/models', { headers: headers() });
    const j = await r.json();
    $('model').textContent = r.ok ? j.data.map(m => m.id).join(', ') : (j.error?.message || r.statusText);
  } catch (e) { $('model').textContent = 'server not reachable'; }
}
loadModel();

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// Small Markdown subset: code fences, inline code, bold, paragraphs.
function md(s) {
  return s.split(/```/).map((part, i) => {
    if (i % 2) { const nl = part.indexOf('\n'); return '<pre><code>' + esc(nl < 0 ? part : part.slice(nl + 1)) + '</code></pre>'; }
    return esc(part).split(/\n{2,}/).filter(p => p.trim()).map(p => '<p>' + p
      .replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>') + '</p>').join('');
  }).join('');
}

function bubble(role, html) {
  $('empty')?.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = html;
  $('msgs').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}

// Thinking text (before </think>) goes in a collapsed block above the answer.
function render(el, text, done) {
  let think = '', ans = text;
  const end = text.indexOf('</think>');
  if (end >= 0) { think = text.slice(0, end).replace('<think>', ''); ans = text.slice(end + 8); }
  else if ($('think').checked) { think = text.replace('<think>', ''); ans = ''; }
  const open = el.querySelector('details')?.open ?? !done;
  el.innerHTML = (think.trim() ? `<details class="think"${open && !ans ? ' open' : ''}><summary>Thinking</summary>${esc(think.trim())}</details>` : '') + md(ans.trim());
}

async function send(text) {
  history.push({ role: 'user', content: text });
  bubble('user', esc(text));
  const el = bubble('assistant', '<span class="stats">…</span>');
  const sys = $('system').value.trim();
  const body = {
    messages: sys ? [{ role: 'system', content: sys }, ...history] : history,
    stream: true, stream_options: { include_usage: true },
    temperature: Number($('temp').value) || 0, max_tokens: Number($('maxtok').value) || 2048,
    chat_template_kwargs: { enable_thinking: $('think').checked },
  };
  busy = new AbortController();
  $('send').textContent = 'Stop';
  let text_ = '', usage = null;
  const t0 = performance.now();
  let t1 = 0;
  try {
    const r = await fetch('/v1/chat/completions', { method: 'POST', headers: headers(), body: JSON.stringify(body), signal: busy.signal });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error?.message || r.statusText); }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
        const j = JSON.parse(line.slice(6));
        if (j.usage) usage = j.usage;
        const c = j.choices?.[0]?.delta?.content;
        if (c) { if (!t1) t1 = performance.now(); text_ += c; render(el, text_, false); $('chat').scrollTop = $('chat').scrollHeight; }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') { el.classList.add('error'); el.textContent = 'Error: ' + e.message; history.pop(); busy = null; $('send').textContent = 'Send'; return; }
  }
  busy = null;
  $('send').textContent = 'Send';
  render(el, text_, true);
  history.push({ role: 'assistant', content: text_.includes('</think>') ? text_.slice(text_.indexOf('</think>') + 8).trim() : text_ });
  if (usage && t1) {
    const gen = (performance.now() - t1) / 1000, n = usage.completion_tokens;
    const s = document.createElement('div');
    s.className = 'stats';
    s.textContent = `${n} tokens, ${(n > 1 ? (n - 1) / gen : 0).toFixed(1)} tok/s, first token after ${((t1 - t0) / 1000).toFixed(1)} s`;
    el.appendChild(s);
  }
}

$('form').onsubmit = e => {
  e.preventDefault();
  if (busy) { busy.abort(); return; }
  const t = $('input').value.trim();
  if (!t) return;
  $('input').value = ''; $('input').style.height = '';
  send(t);
};
$('input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } };
$('input').oninput = () => { $('input').style.height = ''; $('input').style.height = $('input').scrollHeight + 'px'; };
$('clear').onclick = () => { if (busy) busy.abort(); history = []; $('msgs').innerHTML = '<div class="empty" id="empty">Ask anything. Everything runs on this computer.</div>'; };
</script>
</body>
</html>
