[package]
name = "rusting_strata"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
anyhow = "1"
memmap2 = "0.9"
rayon = "1"
half = "2"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
lto = "thin"

[profile.test]
opt-level = 3
